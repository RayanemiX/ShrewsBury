<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shrewsbury Armory — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <img src="assets/logo.png" onerror="this.style.display='none'">
      <h1>SHREWSBURY ARMORY</h1>
      <div class="tag">Espace gestion — accès réservé</div>

      <div class="field">
        <label>Adresse e-mail du compte</label>
        <input id="email" type="email" placeholder="pdg@shrewsbury.local" autocomplete="username">
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button style="width:100%" onclick="login()">Se connecter</button>
      <div class="login-error" id="err"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
 <script>
    const supabaseClient = window.supabaseClient;

    // Vérifie que le client existe
    console.log("Supabase client :", supabaseClient);

    // Si déjà connecté, on saute directement au tableau de bord
    supabaseClient.auth.getSession().then(({ data: { session }, error }) => {

        if (error) {
            console.error("Erreur récupération session :", error);
            return;
        }

        if (session) {
            window.location.href = "dashboard.html";
        }
    });

    async function login() {

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const err = document.getElementById("err");

        err.textContent = "";

        if (!email || !password) {
            err.textContent = "Renseignez l'e-mail et le mot de passe.";
            return;
        }

        console.log("Tentative de connexion :", email);

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        console.log("Auth data :", data);
        console.log("Auth error :", error);

        if (error) {
            console.error("Erreur connexion :", error);
            err.textContent = error.message;
            return;
        }

        console.log("Connexion Supabase réussie !");

        // Recherche du profil
        const {
            data: profile,
            error: profileError
        } = await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id", data.user.id)
            .single();

        console.log("Profil :", profile);
        console.log("Erreur profil :", profileError);

        if (profileError) {
            console.error("Erreur récupération profil :", profileError);

            err.textContent =
                "Erreur lors de la récupération du profil : " +
                profileError.message;

            return;
        }

        if (!profile) {
            err.textContent =
                "Aucun profil trouvé pour ce compte.";

            await supabaseClient.auth.signOut();
            return;
        }

        if (!profile.actif) {
            err.textContent =
                "Ce compte est désactivé.";

            await supabaseClient.auth.signOut();
            return;
        }

        console.log("Profil valide :", profile);
        console.log("Redirection vers dashboard...");

        window.location.href = "dashboard.html";
    }

    document
        .getElementById("password")
        .addEventListener("keydown", function(e) {

            if (e.key === "Enter") {
                login();
            }

        });
</script>
